<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cedolini">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b6e4f">
<title>Cedolini</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#0b6e4f;--line:#e5e7eb;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1b1e25;--text:#f3f4f6;--muted:#9ca3af;--accent:#34d399;--line:#2b2f38}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:560px;margin:0 auto}
h1{font-size:24px;margin:4px 0 14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
input[type=text],select{width:100%;font-size:17px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
button,label.btn{display:block;width:100%;text-align:center;font-size:17px;font-weight:600;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button,label.btn{color:#052e21}}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
.res-title{font-size:18px;font-weight:700;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border:0}.kv.big{font-weight:700;font-size:19px}
.muted{color:var(--muted);font-size:14px}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.item button{width:auto;padding:4px 10px;font-size:14px;background:transparent;color:#dc2626;border:1px solid var(--line)}
#msg{white-space:pre-line;margin-top:10px}
</style>
</head>
<body>
<h1>Cedolini</h1>

<div class="card">
  <h2>Aggiungi cedolini</h2>
  <label class="btn" for="file">Scegli PDF</label>
  <input id="file" type="file" accept="application/pdf" multiple hidden>
  <div id="msg" class="muted"></div>
</div>

<div class="card">
  <h2>Chiedi</h2>
  <input id="q" type="text" placeholder="es. settembre 2026" autocomplete="off" enterkeyhint="search">
  <div class="row">
    <select id="month"></select>
    <select id="year"></select>
  </div>
</div>

<div class="card"><h2>Risposta</h2><div id="result"></div></div>

<div class="card">
  <h2>Cedolini caricati (<span id="count">0</span>)</h2>
  <div id="list"></div>
  <div class="row" style="margin-top:12px">
    <button class="sec" id="exp">Esporta backup</button>
    <button class="sec" id="imp">Ripristina</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
const MONTHS=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const KEY="cedolini.v1";
const eur=new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const $=id=>document.getElementById(id);

// ---------- storage ----------
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Impossibile salvare i dati su questo dispositivo.")}}
let data=load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

// ---------- lettura PDF ----------
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const AMT=/^\d+(?:\.\d{3})*,\d{2}$/;
const toNum=s=>parseFloat(s.replace(/\./g,"").replace(",","."));

function findLabel(words,label){
  const t=label.toLowerCase().split(" ");
  for(let i=0;i+t.length<=words.length;i++){
    let ok=true;
    for(let k=0;k<t.length;k++){if(words[i+k].t.toLowerCase()!==t[k]){ok=false;break}}
    if(ok){const w=words.slice(i,i+t.length);return{x0:Math.min(...w.map(x=>x.x0)),x1:Math.max(...w.map(x=>x.x1)),y:w[0].y}}
  }
  return null;
}
// importo più vicino sotto l'etichetta (y cresce verso l'alto nei PDF)
function below(L,A){
  const c=A.filter(a=>{const top=a.y+a.h*0.8;return top<=L.y+2&&L.y-top<30&&a.x1>L.x0-5&&a.x0<L.x1+90});
  if(!c.length)return null;
  return c.reduce((m,a)=>(a.y+a.h>m.y+m.h?a:m)).v;
}
// importo più vicino a destra, sulla stessa riga
function rightOf(L,A){
  const c=A.filter(a=>a.x0>=L.x1-2&&Math.abs(a.y-L.y)<15);
  if(!c.length)return null;
  return c.reduce((m,a)=>(a.x0<m.x0?a:m)).v;
}

async function parsePdf(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  let full="",lordo=null,rit=null,netto=null;
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const words=[];
    for(const it of tc.items){
      if(!it.str||!it.str.trim())continue;
      full+=it.str+" ";
      const len=it.str.length,re=/\S+/g;let m;
      while((m=re.exec(it.str))){
        const x=it.transform[4];
        words.push({t:m[0],x0:x+it.width*m.index/len,x1:x+it.width*(m.index+m[0].length)/len,y:it.transform[5],h:it.height||8});
      }
    }
    full+="\n";
    words.sort((a,b)=>{const la=Math.round(a.y/3),lb=Math.round(b.y/3);return la!==lb?lb-la:a.x0-b.x0});
    const A=words.filter(w=>AMT.test(w.t)).map(w=>({...w,v:toNum(w.t)}));
    let L;
    if(lordo===null&&(L=findLabel(words,"Totale Competenze")))lordo=below(L,A);
    if(rit===null&&(L=findLabel(words,"Totale Ritenute")))rit=below(L,A);
    if(netto===null&&(L=findLabel(words,"pagare")))netto=rightOf(L,A);
  }
  let m=full.match(/Periodo di competenza\s*:\s*(\d{1,2})\s+(\d{4})/i)||full.match(/\b(0[1-9]|1[0-2])\s+(20\d{2})\b/);
  if(!full.trim())throw new Error("PDF senza testo (forse una scansione).");
  if(!m)throw new Error("Mese/anno di competenza non trovati.");
  if(lordo===null||rit===null)throw new Error("Totali (competenze, ritenute) non trovati.");
  if(netto===null)netto=Math.round((lordo-rit)*100)/100;
  return{month:+m[1],year:+m[2],lordo,ritenute:rit,netto,fileName:file.name};
}

// ---------- domande ----------
function parseQuery(text){
  const lower=text.toLowerCase();let month=null;
  for(const w of lower.split(/[^a-zàèéìòù]+/)){
    if(w.length<3)continue;
    const i=MONTHS.findIndex(n=>n.startsWith(w));
    if(i>=0){month=i+1;break}
  }
  const y=lower.match(/\b(19|20)\d{2}\b/);
  return{month,year:y?+y[0]:null};
}

// ---------- UI ----------
function years(){const ys=[...new Set(data.map(d=>d.year))].sort((a,b)=>b-a);return ys.length?ys:[new Date().getFullYear()]}
function fillSelects(){
  const mS=$("month"),yS=$("year"),cm=mS.value,cy=yS.value;
  mS.innerHTML='<option value="0">Tutto l\'anno</option>'+MONTHS.map((n,i)=>`<option value="${i+1}">${cap(n)}</option>`).join("");
  yS.innerHTML=years().map(y=>`<option>${y}</option>`).join("");
  if(cm)mS.value=cm;
  if(cy&&years().includes(+cy))yS.value=cy;
}
function render(){
  fillSelects();
  const month=+$("month").value,year=+$("year").value;
  const rows=data.filter(d=>d.year===year&&(month===0||d.month===month));
  const r=$("result");
  if(!rows.length){r.innerHTML=`<div class="muted">Nessun cedolino per ${month?cap(MONTHS[month-1])+" ":""}${year}.</div>`}
  else{
    const s=k=>Math.round(rows.reduce((a,d)=>a+d[k],0)*100)/100;
    let h=`<div class="res-title">${month?cap(MONTHS[month-1])+" "+year:"Anno "+year}</div>
      <div class="kv"><span>Lordo</span><span>${eur.format(s("lordo"))}</span></div>
      <div class="kv"><span>Trattenute</span><span>${eur.format(s("ritenute"))}</span></div>
      <div class="kv big"><span>Netto</span><span>${eur.format(s("netto"))}</span></div>`;
    if(!month){
      const have=new Set(rows.map(d=>d.month));
      const miss=MONTHS.map((n,i)=>i+1).filter(m=>!have.has(m)).map(m=>cap(MONTHS[m-1]));
      h+=`<div class="muted" style="margin-top:8px">${miss.length?`Basato su ${have.size} mesi. Mancano: ${miss.join(", ")}.`:"Tutti i 12 mesi presenti."}</div>`;
    }
    r.innerHTML=h;
  }
  $("count").textContent=data.length;
  const sorted=[...data].map((d,i)=>({d,i})).sort((a,b)=>b.d.year-a.d.year||b.d.month-a.d.month);
  $("list").innerHTML=sorted.map(({d,i})=>`<div class="item"><span>${cap(MONTHS[d.month-1])} ${d.year}<br><span class="muted">netto ${eur.format(d.netto)}</span></span><button data-del="${i}">Elimina</button></div>`).join("")||'<div class="muted">Ancora nessun cedolino.</div>';
}

$("q").addEventListener("input",()=>{
  const p=parseQuery($("q").value);
  if(p.year&&years().includes(p.year))$("year").value=p.year;
  $("month").value=p.month||0;render();
});
$("month").addEventListener("change",render);
$("year").addEventListener("change",render);
$("list").addEventListener("click",e=>{
  const i=e.target.dataset&&e.target.dataset.del;
  if(i!==undefined&&confirm("Eliminare questo cedolino?")){data.splice(+i,1);save();render()}
});

$("file").addEventListener("change",async e=>{
  const files=[...e.target.files];let added=0,skipped=0;const errs=[];
  $("msg").textContent="Lettura in corso…";
  for(const f of files){
    try{
      const p=await parsePdf(f);
      if(data.some(d=>d.month===p.month&&d.year===p.year&&d.lordo===p.lordo&&d.netto===p.netto)){skipped++;continue}
      data.push(p);added++;
    }catch(err){errs.push(f.name+": "+err.message)}
  }
  save();e.target.value="";
  $("msg").textContent=`Aggiunti: ${added}. Già presenti: ${skipped}.`+(errs.length?"\nErrori:\n"+errs.join("\n"):"");
  if(added){const last=data[data.length-1];fillSelects();$("year").value=last.year;$("month").value=last.month}
  render();
});

$("exp").addEventListener("click",async()=>{
  const txt=JSON.stringify(data);
  try{if(navigator.share){await navigator.share({title:"Backup cedolini",text:txt});return}}catch(e){}
  try{await navigator.clipboard.writeText(txt);alert("Backup copiato negli appunti. Incollalo in una nota per conservarlo.")}
  catch(e){prompt("Copia questo testo come backup:",txt)}
});
$("imp").addEventListener("click",()=>{
  const t=prompt("Incolla qui il backup:");if(!t)return;
  try{
    const arr=JSON.parse(t);if(!Array.isArray(arr))throw 0;
    let n=0;
    for(const p of arr){
      if(!p||!p.month||!p.year||typeof p.lordo!=="number"||typeof p.netto!=="number")continue;
      if(!data.some(d=>d.month===p.month&&d.year===p.year&&d.lordo===p.lordo&&d.netto===p.netto)){data.push(p);n++}
    }
    save();render();alert("Ripristinati "+n+" cedolini.");
  }catch(e){alert("Backup non valido.")}
});

render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
